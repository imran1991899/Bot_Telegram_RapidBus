name: Telegram Poster Scheduled

on:
  schedule:
    # GitHub uses UTC. (+8 hours for Malaysia)
    - cron: '0 20 * * *'  # 4:00 AM MYT (Poster A) - Note: 20:00 UTC is 04:00 MYT
    - cron: '0 4 * * *'   # 12:00 PM MYT (Poster A)
    - cron: '0 13 * * *'  # 9:00 PM MYT (Poster B)
  
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Which poster to run manually?'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - POSTER_A
          - POSTER_B

jobs:
  post-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyTelegramBotAPI

      - name: Run Poster A (5am & 12pm)
        # Runs on its schedule OR if manual input is 'ALL' or 'POSTER_A'
        if: |
          github.event.schedule == '0 20 * * *' || 
          github.event.schedule == '0 4 * * *' || 
          github.event.inputs.run_mode == 'ALL' || 
          github.event.inputs.run_mode == 'POSTER_A'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot2.py POSTER_A

      - name: Run Poster B (9pm)
        # Runs on its schedule OR if manual input is 'ALL' or 'POSTER_B'
        if: |
          github.event.schedule == '0 13 * * *' || 
          github.event.inputs.run_mode == 'ALL' || 
          github.event.inputs.run_mode == 'POSTER_B'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot2.py POSTER_B
