name: live_Scheduled and Manual 

on:
  schedule:
    - cron: '59 04 * * *'  # Target 5:00 AM KL (Poster A)
      timezone: 'Asia/Kuala_Lumpur'
    - cron: '59 13 * * *'  # Target 2:00 PM KL (Poster A)
      timezone: 'Asia/Kuala_Lumpur'
    - cron: '59 21 * * *'  # Target 10:00 PM KL (Poster B)
      timezone: 'Asia/Kuala_Lumpur'
  workflow_dispatch:      # This is for your manual testing

jobs:
  post-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyTelegramBotAPI

      - name: Run Poster A
        # Triggers for 5am and 2pm KL time slots
        if: |
          github.event.schedule == '59 04 * * *' || 
          github.event.schedule == '59 13 * * *' ||
          github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot2.py POSTER_A

      - name: Run Poster B
        # Triggers for 10pm KL time slot
        if: |
          github.event.schedule == '59 21 * * *' ||
          github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot2.py POSTER_B
