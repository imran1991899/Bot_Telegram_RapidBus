name: live_Scheduled and Manual 

on:
  schedule:
    - cron: '00 20 * * *'  # 4:30 AM MYT (Poster A)
    - cron: '0 5 * * *'    # 2:00 PM MYT (Poster A)
    - cron: '28 13 * * *'  # 10:00 PM MYT (Poster B)
  workflow_dispatch:      # This is for your manual testing

jobs:
  post-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyTelegramBotAPI

      - name: Run Poster A
        # Run if it's the 5am/12pm schedule OR if you clicked "Run workflow" manually
        if: |
          github.event.schedule == '00 20 * * *' || 
          github.event.schedule == '0 5 * * *'
        # github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot2.py POSTER_A

      - name: Run Poster B
        # Run if it's the 9pm schedule OR if you clicked "Run workflow" manually
        if: |
          github.event.schedule == '28 13 * * *'
        # github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot2.py POSTER_B
